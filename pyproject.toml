[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-azure-ad-auth"
# dynamic = ["version"] # Use this if you plan to use setuptools_scm for versioning
version = "1.3.1" # If not using dynamic versioning, manually update this
authors = [
    { name = "Jason Christa", email = "jason@jasonchrista.com" },
]
description = "Django Azure AD Auth allows you to authenticate through Azure Active Directory."
readme = "README.rst"
requires-python = ">=3.8" # Update this to your desired minimum Python version
keywords = [
    "django",
    "azure",
    "ad",
    "active directory",
    "auth",
    "authentication"
]
license = { text = "BSD" } # Or { file = "LICENSE" } if you have a LICENSE file
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Topic :: Utilities",
    "License :: OSI Approved :: BSD License",
    "Framework :: Django",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: Django :: 3.2", # Example: Specify Django versions if relevant
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
]
dependencies = [
    "Django>=3.2", # Updated to a more modern Django baseline
    "requests>=2.0",
    "PyJWT>=1.4",
    "python-jose>=1.4",
    "cryptography>=1.4",
    # "azure-graphrbac>=0.30.0", # Consider replacing this with newer Azure SDKs if applicable
    "msal>=1.20.0", # django-azure-auth (from Weird Sheep Labs) uses msal
]

[project.urls]
"Homepage" = "https://github.com/hitenjadeja/django-azure-ad-auth"
"Bug Tracker" = "https://github.com/hitenjadeja/django-azure-ad-auth/issues"
"Source" = "https://github.com/hitenjadeja/django-azure-ad-auth"

# Optional: Configuration for setuptools specific features
[tool.setuptools]
packages = ["azure_ad_auth"] # Explicitly list your package(s) if not using find
# If your project structure is 'src/azure_ad_auth', uncomment the following:
# package-dir = {"" = "src"}
# include-package-data = true # This is typically true by default for [project] metadata
# zip-safe = false # This is also typically handled by the build system

# Optional: If you want to use setuptools_scm for dynamic versioning
# [tool.setuptools_scm]
# write_to = "azure_ad_auth/_version.py" # Adjust path as needed